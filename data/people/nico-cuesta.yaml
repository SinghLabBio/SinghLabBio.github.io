bio: |
 Salamanca public education system! PhD in Biochemistry at CNIO (Madrid, Spain). Old-school biologist learning biophysics and coding.
 
 Kinase structure, biochemistry and signaling. I will be driving the initial wet lab efforts studying drug-resistance of kinase-variants focused on their biochemistry. Allostery can explain everything.

 Outside of the lab: Soccer fan, futsal is even better. Planting, cooking, and economics; in that order. I will eventually declare independence with my own vegetable patch.

