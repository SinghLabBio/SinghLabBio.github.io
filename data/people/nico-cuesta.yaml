bio: |
 Trained in Spain at CNIO Madrid and then was a STARR BRIA fellow with Arvin Dar. 
 
 Nico focuses on kinase expression, binding, and activity. He will be driving our initial wet lab efforts expressing and studying drug-resistant kinase-variants via experimental biochemical methods.

 Outside of the lab: Nico is a huge soccer fan!

