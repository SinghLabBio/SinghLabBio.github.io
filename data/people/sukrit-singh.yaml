# ---------------------------------------------------------------------------
# data/people/<slug>.yaml  --  one file per person.  Filename = URL id
# (/team/#person-<slug>).  Fields marked CARD show on the tile; DIALOG fields
# show only in the pop-up; both = both.  Everything except name/group/weight
# is optional; delete what you don't want shown.
# ---------------------------------------------------------------------------
weight: 10                  # sort order within a group (low = first)
group: pi                   # pi | postdoc | grad | undergrad | staff | alumni

name: Sukrit Singh          # both
given: Sukrit               # used for the monogram fallback only
family: Singh
pronouns: he/him            # both (delete line to hide)
title: Incoming Assistant Professor  # both
headline: >-                # CARD -- one line, markdown ok
  Dynamics, allostery, and drug resistance
affiliations:               # DIALOG
  - Fox Chase Cancer Center
  - Institute for Cancer Research
  - Folding@home

photo: images/people/sukrit-singh-environment.jpg   # relative to assets/; omit for monogram
photoRatio: 4x5             # 1x1 | 4x5 | 3x4  (keep in sync with aspect-ratio in custom.css)
photoAnchor: Center         # Center | Smart | Top | TopLeft ... (use Center for wide environmental shots)

bio: |                      # DIALOG -- markdown, multiple paragraphs ok
  Trained at WashU with [Gregory R. Bowman](https://bowmanlab.seas.upenn.edu/) and then did postdoctoral training with 
  [John Chodera](https://choderalab.org) and Markus Seeliger.

  Outside the lab: I enjoy making cocktails, taking my dog on a walk, and playing video/TTRPG games with friends

