# ---------------------------------------------------------------------------
# data/publications_meta.yaml -- hand-maintained extras, keyed by DOI.
# publications.json is regenerated from Zotero and should never be edited by
# hand; anything you want to persist across re-exports goes here instead.
# Every key is optional. Unknown DOIs are ignored (a typo just does nothing).
# ---------------------------------------------------------------------------
# "10.1234/example":
#   highlight: true          # or a short label, e.g. "Cover article"
#   code:  https://github.com/SinghLabBio/...
#   data:  https://zenodo.org/records/...
#   pdf:   /papers/example.pdf        # drop the file in static/papers/
#   press: https://...
#   image: images/pubs/spike.png      # relative to assets/ (or an https:// URL); resized to webp at build
#   imagePlacement: abstract          # abstract (default: shown when the abstract is unfurled) | card (always-visible thumbnail)
#   imageAlt: "Cryptic pocket opening in the spike trimer"   # accessibility text; defaults to "Figure from: <title>"
#   imageCaption: >-                  # optional, markdown ok (abstract placement only)
#     Spike opening pathway from 0.1 s of Folding@home sampling.
#   url:   https://...                # override the title link (default: https://doi.org/<DOI>)
#   venue: "J Matern Fetal Neonatal Med"  # override the journal name shown
#   blurb: >-                         # one-line plain-language summary, markdown ok
#     Why this paper matters, in one sentence.
#   keepPreprint: true                # show a preprint even if a journal version exists
#   supersededBy: "10.xxxx/yyy"       # force-hide this preprint (when titles differ)
#   hide: true                        # hide any entry entirely
#   roles: [corresponding, lead]      # symbols for `defaultAuthor` (data/publication_roles.yaml)
#   roles:                            # ...or per author, keyed by family name
#     Singh: [corresponding]
#     Cuesta: [co-first]

