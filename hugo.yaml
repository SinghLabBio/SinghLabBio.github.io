baseURL: https://singhlab.bio/
locale: en-us
title: Sukrit Singh Lab

# Keep the raw-HTML compatibility: lets me drop NGL / Mol* / 3Dmol.js /
# Plotly widgets straight into a Markdown page without writing a shortcode first.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

enableInlineShortcodes: true
enableGitInfo: true          # powers "last updated" dates from commit history

module:
  imports:
    - path: github.com/imfing/hextra

# Required by the deploy workflow's --cacheDir flag
caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - {name: Research,     pageRef: /research,     weight: 1}
    - {name: Team,         pageRef: /team,         weight: 2}
    - {name: Publications, pageRef: /publications, weight: 3}
    - {name: Software,     pageRef: /software,     weight: 4}
    - {name: News,         pageRef: /news,         weight: 5}
    - {name: "Join",       pageRef: /join,         weight: 6}
    - {name: Contact,      pageRef: /contact,      weight: 7}
    # - name: GitHub
    #   url: "https://github.com/SinghLabBio"
    #   weight: 8
    #   params: {icon: github}
    - name: Search
      params:
        type: search

params:
  description: "Biophysical AI for dynamics, allostery, and therapeutic resistance."
  navbar:
    displayTitle: true
    displayLogo: true
    width: full
    logo:
      path: images/lab-logo-only-animated.gif   # ribbon glyph only; works in both modes
      link: /
      width: 34
      height: 27
  imageZoom:
    enable: true

  page:
    width: full
  theme:
    default: system      # consider `system` for a lab site rather than forcing dark
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: full
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  editURL:
    enable: false
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
